name: app_template
description: "Generic Flutter starter: Clean Architecture + BLoC/Cubit, GetIt, GoRouter, Dio."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6

  # Dependency injection
  get_it: ^7.7.0

  # Navigation
  go_router: ^13.2.1

  # HTTP client
  dio: ^5.4.3+1

  # Value equality
  equatable: ^2.0.5

  # Functional programming (Either)
  dartz: ^0.10.1

  # Local persistence
  shared_preferences: ^2.2.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Mocking
  mocktail: ^1.0.4

  # Bloc testing utilities
  bloc_test: ^9.1.7

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
